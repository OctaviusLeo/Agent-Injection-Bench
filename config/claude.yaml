# Claude target and second-opinion judge (.kiro/specs/claude-provider), billed to the owner's Anthropic API credit.
model: claude-haiku-5-5            # the Claude_Target, a key in models.yaml
run_cap_usd: 5.00                  # Run_Cap set by the owner on 2026-10-29; every Claude run stops before a request that could pass it
max_tokens: 16000                  # per request; adaptive thinking counts toward it
effort: medium                     # Claude Haiku 5.5's default, written out so it is recorded
conditions: [clean, direct, important_instructions]   # the OpenAI hosted grid's conditions and defenses
defenses: [none, delimit, hierarchy, filter]
ledger: results/claude_ledger.jsonl
worst_case_chars_per_token: 3      # precheck: prompt characters / 3 as uncached tokens, plus max_tokens
judge:                             # second-opinion judge (Req C3); not a model under test
  model: claude-sonnet-5-5
  max_tokens: 8000
  effort: medium
# https://platform.claude.com/docs/en/about-claude/pricing, read 2026-10-29. Uncached prompt tokens are charged at the
# 5-minute cache-write rate, so recorded spend is an upper bound.
prices_per_million_usd:
  claude-haiku-5-5:
    input: 0.10
    cached_input: 0.01
    cache_write: 0.125
    output: 0.50
    long_context_tokens: 100000    # prompts over 100,000 tokens are billed at the rates below
    long_context: {input: 0.50, cached_input: 0.05, cache_write: 0.625, output: 2.50}
  claude-sonnet-5-5:
    input: 2.00
    cached_input: 0.10
    cache_write: 2.50
    output: 10.00
