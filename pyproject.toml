# Private portfolio repository: not published anywhere, so no license field or classifiers.
[project]
name = "aib"
version = "0.1.0"
description = "Agent Injection Bench: prompt-injection success and defense cost for tool-using agents in a simulated sandbox."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# One dependency set, every entry pinned exactly; uv.lock pins the transitive closure.
dependencies = [
    "agentdojo==0.1.35",
    "openai==3.35.0",
    "transformers==5.20.1",
    "torch==2.14.1",
    "huggingface_hub==2.2.0",
    "numpy==2.5.4",
    "matplotlib==3.11.2",
    "pyyaml==6.0.3",
    "pydantic==2.14.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.170.1",
]

[tool.uv]
package = false
python-preference = "system"

# CPU wheels for torch: the filter classifier runs on the CPU, and CI stays small.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "gpu: needs the NVIDIA GPU",
    "docker: needs Docker",
    "network: needs the internet",
    "classifier: needs the downloaded classifier snapshot in ~/aib-models",
]

[tool.coverage.run]
source = ["aib", "scripts"]
omit = ["*/__init__.py"]
