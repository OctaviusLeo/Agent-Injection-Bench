# llama.cpp model server for Agent Injection Bench: Compose project "aib", service "llm".
# Started and stopped only through scripts/serve.sh, which sets the per-model variables below.
name: aib
services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda12-b11580@sha256:c4348afb91499b10fad12f92626c7a8ca8b69d6475d10c793b810cb61237ce00
    ports:
      - "127.0.0.1:8091:8080"
    volumes:
      - ${AIB_MODELS:?AIB_MODELS must be set}:/models:ro
    command: >-
      --host 0.0.0.0 --port 8080
      --model /models/${AIB_MODEL_PATH:?AIB_MODEL_PATH must be set}
      --ctx-size ${AIB_CTX_SIZE:?AIB_CTX_SIZE must be set}
      --parallel ${AIB_PARALLEL:?AIB_PARALLEL must be set}
      ${AIB_SERVER_FLAGS:?AIB_SERVER_FLAGS must be set}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 30s
